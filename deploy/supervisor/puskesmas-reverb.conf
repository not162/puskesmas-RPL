; Server WebSocket (pembaruan langsung) — /etc/supervisor/conf.d/puskesmas-reverb.conf
[program:puskesmas-reverb]
command=php /var/www/puskesmas/artisan reverb:start --host=127.0.0.1 --port=6001
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
minfds=10000
redirect_stderr=true
stdout_logfile=/var/www/puskesmas/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB

