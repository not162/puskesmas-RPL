; Worker antrean (email OTP & WhatsApp) — /etc/supervisor/conf.d/puskesmas-antrean.conf
; supervisorctl reread && supervisorctl update && supervisorctl status
[program:puskesmas-antrean]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/puskesmas/artisan queue:work --sleep=2 --tries=3 --backoff=10 --max-time=3600
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/www/puskesmas/storage/logs/antrean.log
stdout_logfile_maxbytes=10MB

