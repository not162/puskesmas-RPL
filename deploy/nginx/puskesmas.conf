# Nginx — Sistem Informasi Puskesmas
# Salin ke /etc/nginx/sites-available/puskesmas lalu:
#   ln -s /etc/nginx/sites-available/puskesmas /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Ganti "puskesmas.example.go.id" dengan domain Anda. Sertifikat HTTPS dibuat oleh certbot (lihat docs/DEPLOY.md).

# Batas laju permintaan per IP (melindungi halaman masuk & API dari serbuan)
limit_req_zone $binary_remote_addr zone=pkm_umum:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=pkm_masuk:10m rate=5r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name puskesmas.example.go.id;
    # Semua HTTP dialihkan ke HTTPS (certbot juga dapat menambahkan ini otomatis)
    location /.well-known/acme-challenge/ { root /var/www/puskesmas/public; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name puskesmas.example.go.id;

    root /var/www/puskesmas/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/puskesmas.example.go.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/puskesmas.example.go.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    client_max_body_size 8m;           # unggah KTP maks 5 MB + formulir
    add_header X-Content-Type-Options nosniff always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Aset statis: cache panjang (nama berkas memakai ?v=)
    location ~* \.(css|js|woff2|svg|png|jpg|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # WebSocket Laravel Reverb (php artisan reverb:start di 127.0.0.1:6001)
    location ~ ^/(app|apps)/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:6001;
    }

    location = /login            { limit_req zone=pkm_masuk burst=10 nodelay; try_files $uri /index.php?$query_string; }
    location = /api/v1/auth/login { limit_req zone=pkm_masuk burst=10 nodelay; try_files $uri /index.php?$query_string; }

    location / {
        limit_req zone=pkm_umum burst=40 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Tolak berkas tersembunyi & sensitif (.env, .git, dll.)
    location ~ /\.(?!well-known).* { deny all; }
    location ~* \.(env|log|sql|gz|sh|md)$ { deny all; }
}

