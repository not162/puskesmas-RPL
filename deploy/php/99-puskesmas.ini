; PHP 8.4 produksi — salin ke /etc/php/8.4/fpm/conf.d/99-puskesmas.ini lalu: systemctl restart php8.4-fpm
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
upload_max_filesize = 6M
post_max_size = 8M
max_execution_time = 60
date.timezone = Asia/Jakarta

; Sesi aman
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1

; OPcache — kunci kecepatan (tanpa ini tiap permintaan memuat ulang aplikasi ±0,6 dtk)
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0   ; deploy.sh me-reload PHP-FPM agar kode baru terbaca
opcache.jit = tracing
opcache.jit_buffer_size = 64M

