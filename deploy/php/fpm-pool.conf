; Potongan untuk /etc/php/8.4/fpm/pool.d/www.conf (sesuaikan dengan RAM server)
; Rumus kasar: pm.max_children = (RAM yang disisihkan untuk PHP) / 60 MB
;   VPS 2 GB  -> 16   ·   VPS 4 GB -> 32
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

